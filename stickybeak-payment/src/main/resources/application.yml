server:
  port: 8085

spring:
  application:
    name: stickybeak-payment
  config:
    import:
      - optional:nacos:stickybeak-payment.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml

management:
  endpoints:
    web:
      exposure:
        include: health,info
