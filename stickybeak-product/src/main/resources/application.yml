server:
  port: 8082

spring:
  application:
    name: stickybeak-product
  # 多环境：dev 默认；profile 激活后 Nacos 自动叠加加载 stickybeak-product-{profile}.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:stickybeak-product.yml
      # 显式按 profile 叠加（SCA 2023 的 config import 不会自动补 -{profile} 变体）
      - optional:nacos:stickybeak-product-${spring.profiles.active:dev}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        file-extension: yml
        # 动态刷新默认开启（spring.cloud.nacos.config.refresh-enabled=true）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/stickybeak_product?useSSL=false&serverTimezone=Australia/Sydney&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 本机 Docker 映射在 16379（Windows 保留段），容器网络内用 sb-redis:6379
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  elasticsearch:
    # 宿主 19200（9200 被 Windows 保留段占用）；容器网络内通过 ES_URIS=http://sb-elasticsearch:9200 覆盖
    uris: ${ES_URIS:http://localhost:19200}
    connection-timeout: 2s
    socket-timeout: 5s

# 对象存储：容器网络内 sb-minio:9000；public-endpoint 是浏览器可达地址（预签名 URL 的 host 必须与之一致）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_USER:minioadmin}
  secret-key: ${MINIO_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:stickybeak}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # ES 只用于搜索且有 MySQL 回退，不可用时不应把整个商品服务标记为 DOWN
    elasticsearch:
      enabled: false

stickybeak:
  search:
    elasticsearch:
      # 关闭后关键词搜索只走 MySQL LIKE
      enabled: ${SEARCH_ES_ENABLED:true}
      # 全量对账（启动时也会执行一次）
      reindex-cron: ${SEARCH_REINDEX_CRON:0 30 3 * * *}

# Seata AT：结账"扣库存（product 库）+ 写订单（order 库）"的分布式事务。
# 不经注册中心，直连 TC。客户端是 Spring Cloud Alibaba 2023.0.1.x 自带的 2.0；TC 用 2.3.0（2.0–2.2 的 file 锁存储在锁冲突时会泄漏行锁，见 HANDOFF）
seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: stickybeak-tx-group
  service:
    vgroup-mapping:
      stickybeak-tx-group: default
    grouplist:
      default: ${SEATA_ADDR:localhost:8091}
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT

# OpenAPI 文档（网关 /doc.html 聚合）。生产环境 API_DOCS_ENABLED=false 关闭，避免暴露接口清单
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
knife4j:
  enable: true
  production: ${KNIFE4J_PRODUCTION:false}
