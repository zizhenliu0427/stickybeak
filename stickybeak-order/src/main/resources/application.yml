server:
  port: 8084

spring:
  application:
    name: stickybeak-order
  config:
    import:
      - optional:nacos:stickybeak-order.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        file-extension: yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/stickybeak_order?useSSL=false&serverTimezone=Australia/Sydney&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK；失败重试由 MessageRetrySupport 转发到延迟重试队列完成
        # （容器自带的 retry 对 catch 住异常的监听器不生效，已移除）
        acknowledge-mode: manual

stickybeak:
  order:
    # 订单支付超时时间（毫秒），同时决定延迟队列 TTL
    ttl-millis: ${ORDER_TTL_MILLIS:1800000}
    mq:
      max-retries: ${ORDER_MQ_MAX_RETRIES:5}
      retry-delay-millis: ${ORDER_MQ_RETRY_DELAY_MILLIS:10000}
    sweep:
      # 兜底扫描：超时消息丢失时关闭超过 TTL + 宽限期仍未支付的订单
      enabled: ${ORDER_SWEEP_ENABLED:true}
      grace-millis: 300000
      interval-millis: 300000
      batch-size: 100

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Seata AT：结账"扣库存（product 库）+ 写订单（order 库）"的分布式事务。
# 不经注册中心，直连 TC（docker-compose 中的 seata-server 2.0，与 Spring Cloud Alibaba 2023.0.1.x 的客户端版本一致）
seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: stickybeak-tx-group
  service:
    vgroup-mapping:
      stickybeak-tx-group: default
    grouplist:
      default: ${SEATA_ADDR:localhost:8091}
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT
