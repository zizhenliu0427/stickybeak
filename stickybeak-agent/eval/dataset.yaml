# 评测集（Issue 13.7）：52 条对话，当前用户是 7，业务数据见 eval/fixtures.py。
# 字段：
#   turns          用户依次发出的消息（多轮时前几轮只是上下文，指标按最后一轮算）
#   intent         期望的意图（最后一轮）
#   tools          必须调用到的工具（任意顺序）
#   forbid_tools   不应该调用的工具
#   confirm        是否应该出现"等待确认"（写操作）；评测从不确认，所以任何写操作都不应被执行
#   sources        期望检索到的知识库文档（doc_id），用于召回率@k
#   refuse         知识库没覆盖，应该明确说不知道
#   forbid_answer  回答里不应出现的内容（越权泄露、系统提示词等）

# ---------------- 导购 shopping（10） ----------------
- id: shop-01
  category: shopping
  turns: ["有没有 UNSW 的公交站牌冰箱贴？"]
  expect: {intent: shopping, tools: [search_products], confirm: false}
- id: shop-02
  category: shopping
  turns: ["推荐几个 15 澳元以内的冰箱贴"]
  expect: {intent: shopping, tools: [search_products], confirm: false}
- id: shop-03
  category: shopping
  turns: ["我想要鸟类的冰箱贴"]
  expect: {intent: shopping, tools: [search_products], confirm: false}
- id: shop-04
  category: shopping
