name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend:
    name: Backend build & test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven verify
        run: mvn -B verify

  frontend:
    name: Frontend typecheck, lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stickybeak-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: stickybeak-frontend/package-lock.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  agent:
    name: AI agent lint & test (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stickybeak-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: stickybeak-agent/uv.lock
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # 单测用脚本化的假模型，不调用真实模型 API；评测集（eval/）需要模型 key，单独手动运行
      - run: uv run pytest -q

  e2e:
    name: Playwright journeys (desktop + mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stickybeak-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: stickybeak-frontend/package-lock.json
      - run: npm install
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run journeys against the Vite dev server (API mocked in the browser)
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: stickybeak-frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker/docker-compose-infra.yml config -q
          docker compose -f docker/docker-compose.yml config -q
          docker compose -f docker/docker-compose.prod.yml --env-file docker/.env.prod.example config -q
