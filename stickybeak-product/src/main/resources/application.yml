server:
  port: 8082

spring:
  application:
    name: stickybeak-product
  config:
    import:
      - optional:nacos:stickybeak-product.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        file-extension: yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/stickybeak_product?useSSL=false&serverTimezone=Australia/Sydney&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 本机 Docker 映射在 16379（Windows 保留段），容器网络内用 sb-redis:6379
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  elasticsearch:
    # 默认对应 docker-compose-infra.yml 映射到宿主机的 19200；容器网络内通过 ES_URIS=http://elasticsearch:9200 覆盖
    uris: ${ES_URIS:http://localhost:19200}
    connection-timeout: 2s
    socket-timeout: 5s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # ES 只用于搜索且有 MySQL 回退，不可用时不应把整个商品服务标记为 DOWN
    elasticsearch:
      enabled: false

stickybeak:
  search:
    elasticsearch:
      # 关闭后关键词搜索只走 MySQL LIKE
      enabled: ${SEARCH_ES_ENABLED:true}
      # 全量对账（启动时也会执行一次）
      reindex-cron: ${SEARCH_REINDEX_CRON:0 30 3 * * *}

# Seata AT：结账"扣库存（product 库）+ 写订单（order 库）"的分布式事务。
# 不经注册中心，直连 TC（docker-compose 中的 seata-server 2.0，与 Spring Cloud Alibaba 2023.0.1.x 的客户端版本一致）
seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: stickybeak-tx-group
  service:
    vgroup-mapping:
      stickybeak-tx-group: default
    grouplist:
      default: ${SEATA_ADDR:localhost:8091}
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT

# OpenAPI 文档（网关 /doc.html 聚合）。生产环境 API_DOCS_ENABLED=false 关闭，避免暴露接口清单
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
knife4j:
  enable: true
  production: ${KNIFE4J_PRODUCTION:false}
