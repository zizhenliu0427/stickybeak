version: "3.8"

# Full stack: infra + all Java services + frontend (Nginx).
# Start: docker compose -f docker/docker-compose.yml up -d --build

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: stickybeak-gateway
    container_name: sb-gateway
    environment:
      NACOS_ADDR: nacos:8848
    ports:
      - "8080:8080"
    depends_on:
      - nacos

  auth:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: stickybeak-auth
    container_name: sb-auth
    environment: &svc-env
      NACOS_ADDR: nacos:8848
    depends_on: &svc-deps
      - nacos
      - mysql
      - redis

  product:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: stickybeak-product
    container_name: sb-product
    environment: *svc-env
    depends_on: *svc-deps

  cart:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: stickybeak-cart
    container_name: sb-cart
    environment: *svc-env
    depends_on: *svc-deps

  order:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: stickybeak-order
    container_name: sb-order
    environment: *svc-env
    depends_on:
      - nacos
      - mysql
      - redis
      - rabbitmq
      - seata

  payment:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: stickybeak-payment
    container_name: sb-payment
    environment: *svc-env
    depends_on:
      - nacos
      - mysql
      - rabbitmq

  notification:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      args:
        MODULE: stickybeak-notification
    container_name: sb-notification
    environment: *svc-env
    depends_on:
      - nacos
      - rabbitmq
      - mailhog

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sb-frontend
    ports:
      - "80:80"
    depends_on:
      - gateway

  # --- infrastructure (same definitions as docker-compose-infra.yml) ---
  mysql:
    image: mysql:8.0
    container_name: sb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Australia/Sydney
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: sb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sb-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: sb-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: sb-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    ports:
      - "8848:8848"
      - "9848:9848"

  seata:
    image: seataio/seata-server:1.8.0
    container_name: sb-seata
    environment:
      SEATA_PORT: "8091"
      store.mode: file
    ports:
      - "8091:8091"
    depends_on:
      - mysql

  minio:
    image: minio/minio:latest
    container_name: sb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sb-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
  redis-data:
  es-data:
  minio-data:
