server:
  port: 8086

spring:
  application:
    name: stickybeak-notification
  config:
    import:
      - optional:nacos:stickybeak-notification.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        file-extension: yml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    # 本地默认 MailHog。生产可直接接 Amazon SES 的 SMTP 接口：
    #   MAIL_HOST=email-smtp.<region>.amazonaws.com MAIL_PORT=587 MAIL_SMTP_AUTH=true MAIL_SMTP_STARTTLS=true
    #   MAIL_USERNAME / MAIL_PASSWORD 为 SES SMTP 凭证，MAIL_FROM 必须是 SES 已验证的发件地址
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
            required: ${MAIL_SMTP_STARTTLS:false}

stickybeak:
  mail:
    from: ${MAIL_FROM:orders@stickybeak.com.au}

management:
  endpoints:
    web:
      exposure:
        include: health,info
