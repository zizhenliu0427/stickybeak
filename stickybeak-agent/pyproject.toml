[project]
name = "stickybeak-agent"
version = "0.1.0"
description = "StickyBeak AI shopping assistant (FastAPI + LangGraph + RAG)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph-checkpoint-mysql[aiomysql]>=3.0,<4",
    # PyMySQL 1.2 把 escape_bytes_prefixed 换成了占位字符串，aiomysql 0.3.x 仍在调用它，写入 bytes 会报错
    "pymysql>=1.1,<1.2",
    "elasticsearch>=8.14,<9",
    "redis>=5.0",
    "nacos-sdk-python>=2.0",
    # 1.3.0 的 wheel 漏打了 skywalking.protocol，从源码包安装（见下方 no-binary-package）；
    # 1.2.x 在 Python 3.12 上加载插件有 bug（只创建模块不执行），所有插件都不生效
    "apache-skywalking==1.3.0",
    "pyyaml>=6.0",
    # MCP：Python 官方 SDK（服务端 + 客户端）；langchain-mcp-adapters 目前只支持 mcp 1.x
    "mcp>=1.24,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
]

[tool.uv]
no-binary-package = ["apache-skywalking"]

[dependency-groups]
dev = [
    "fakeredis>=2.23",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
