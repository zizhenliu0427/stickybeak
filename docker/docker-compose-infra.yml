# Infrastructure only: databases, middleware, consoles.
# Start: docker compose -f docker/docker-compose-infra.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: sb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Australia/Sydney
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sb-redis
    ports:
      # 主机 6379/6380 常被 Windows Hyper-V 动态保留段（6346-6445）占用，宿主映射到 16379；
      # 容器间互通仍走 6379，宿主/IDE 访问用 localhost:16379
      - "16379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sb-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  elasticsearch:
    # 官方镜像 + IK 中文分词插件（docker/elasticsearch/Dockerfile）
    build: ./elasticsearch
    image: stickybeak/elasticsearch-ik:8.14.3
    container_name: sb-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "19200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: sb-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "19848:9848"

  seata:
    # 与 Spring Cloud Alibaba 2023.0.1.x 自带的 Seata 2.0 客户端对齐；file 存储，单机演示用
    image: seataio/seata-server:2.0.0
    container_name: sb-seata
    environment:
      SEATA_PORT: "8091"
      STORE_MODE: file
    ports:
      - "8091:8091"
      - "7091:7091"   # 控制台

  # --- SkyWalking 全链路追踪（Sprint 12）：BanyanDB 存储 + OAP + UI ---
  # BanyanDB 是 SkyWalking 10 的默认存储，专为链路 / 指标 / 日志设计，比 ES 省资源，也不和商品搜索抢 ES 内存
  banyandb:
    image: apache/skywalking-banyandb:0.10.3
    container_name: sb-banyandb
    command: >-
      standalone
      --stream-root-path /data --measure-root-path /data --trace-root-path /data
      --property-root-path /data --metadata-root-path /data --schema-server-root-path /data
    volumes:
      - banyandb-data:/data
    ports:
      - "17912:17912"
      - "17913:17913"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -nz 127.0.0.1 17912"]
      interval: 10s
      timeout: 5s
      retries: 12

  oap:
    image: apache/skywalking-oap-server:10.4.0
    container_name: sb-oap
    depends_on:
      banyandb:
        condition: service_healthy
    environment:
      SW_STORAGE: banyandb
      SW_STORAGE_BANYANDB_TARGETS: banyandb:17912
      SW_HEALTH_CHECKER: default
      # 默认文件 + 业务自定义指标（死信队列积压，见 skywalking/meter-analyzer-config/stickybeak.yaml）
      SW_METER_ANALYZER_ACTIVE_FILES: datasource,threadpool,satellite,go-runtime,python-runtime,continuous-profiling,java-agent,go-agent,ruby-runtime,stickybeak
      JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - ./skywalking/alarm-settings.yml:/skywalking/config/alarm-settings.yml:ro
      - ./skywalking/meter-analyzer-config/stickybeak.yaml:/skywalking/config/meter-analyzer-config/stickybeak.yaml:ro
      # 网关端点按 URL 模板分组（/api/products/{var}），避免订单号、slug 让端点数无限增长
      - ./skywalking/endpoint-name-grouping.yml:/skywalking/config/endpoint-name-grouping.yml:ro
    ports:
      - "11800:11800"   # agent 上报（gRPC）
      - "12800:12800"   # UI / 查询（HTTP）
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:12800/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  skywalking-ui:
    image: apache/skywalking-ui:10.4.0
    container_name: sb-skywalking-ui
    depends_on:
      - oap
    environment:
      SW_OAP_ADDRESS: http://oap:12800
    ports:
      - "8088:8080"

  minio:
    # MinIO 社区版已停止向 Docker Hub 发布镜像，改用 quay.io 最后发布的历史版本
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sb-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
  redis-data:
  es-data:
  minio-data:
  banyandb-data:
