# SkyWalking OAP 10.x 告警规则（MQE 表达式）。挂载到 OAP 容器的 /skywalking/config/alarm-settings.yml。
# 每条规则：expression 结果为 1 即触发；period 为评估窗口（分钟）；silence-period 为触发后静默的检查次数。
# 告警在 SkyWalking UI 的 Alerting 页面查看；要推送钉钉 / 飞书 / Slack 时在下方 hooks 里配置。
rules:
  # 服务整体：成功率低于 95%（service_sla 以万分比表示，9500 = 95%）
  service_error_rate_rule:
    expression: sum(service_sla < 9500) >= 2
    period: 10
    silence-period: 5
    recovery-observation-period: 2
    message: Success rate of service {name} is lower than 95% in 2 minutes of last 10 minutes

  # 服务整体：平均响应时间超过 1 秒
  service_resp_time_rule:
    expression: sum(service_resp_time > 1000) >= 3
    period: 10
    silence-period: 5
    recovery-observation-period: 3
    message: Response time of service {name} is more than 1000ms in 3 minutes of last 10 minutes

  # 慢接口：P99 超过 2 秒，或平均超过 1 秒
  endpoint_p99_rule:
    expression: sum(endpoint_percentile{p='99'} > 2000) >= 3
    period: 10
    silence-period: 5
    recovery-observation-period: 3
    message: P99 response time of endpoint {name} is more than 2000ms in 3 minutes of last 10 minutes

  endpoint_resp_time_rule:
    expression: sum(endpoint_resp_time > 1000) >= 3
    period: 10
    silence-period: 5
    recovery-observation-period: 3
    message: Response time of endpoint {name} is more than 1000ms in 3 minutes of last 10 minutes

  # 接口错误率：成功率低于 90%
  endpoint_error_rate_rule:
    expression: sum(endpoint_sla < 9000) >= 2
    period: 10
    silence-period: 5
    recovery-observation-period: 2
    message: Success rate of endpoint {name} is lower than 90% in 2 minutes of last 10 minutes

  # 慢 SQL / 慢 Redis：单次访问平均超过 500ms
  database_access_resp_time_rule:
    expression: sum(database_access_resp_time > 500) >= 2
    period: 10
    message: Response time of database access {name} is more than 500ms in 2 minutes of last 10 minutes

  # 死信队列积压：支付、关单、退款消息重试耗尽后进入死信队列，需要人工处理（自定义指标，见 meter-analyzer-config/stickybeak.yaml）
  dlq_backlog_rule:
    expression: sum(meter_stickybeak_dlq_backlog > 0) >= 1
    period: 5
    silence-period: 30
    recovery-observation-period: 2
    message: Dead-letter queues of {name} have messages waiting for manual handling (retries exhausted)
