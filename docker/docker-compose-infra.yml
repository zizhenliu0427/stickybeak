# Infrastructure only: databases, middleware, consoles.
# Start: docker compose -f docker/docker-compose-infra.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: sb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Australia/Sydney
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sb-redis
    ports:
      # 主机 6379/6380 常被 Windows Hyper-V 动态保留段（6346-6445）占用，宿主映射到 16379；
      # 容器间互通仍走 6379，宿主/IDE 访问用 localhost:16379
      - "16379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sb-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: sb-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: sb-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"

  seata:
    image: seataio/seata-server:1.8.0
    container_name: sb-seata
    environment:
      SEATA_PORT: "8091"
      store.mode: file
    ports:
      - "8091:8091"
    depends_on:
      - mysql

  minio:
    # MinIO 社区版已停止向 Docker Hub 发布镜像，改用 quay.io 最后发布的历史版本
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: sb-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sb-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
  redis-data:
  es-data:
  minio-data:
